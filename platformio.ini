; Dos versiones del firmware, iguales salvo la cantidad de relés:
;   cultivo-4: 2 carpas x 4 relés (Luz, Extractor, Intractor, Riego), todos directo al ESP32.
;   cultivo-8: 2 carpas x 8 relés; los relés 9-16 van por un expansor PCF8574.
; El botón de subir de VS Code usa la de default_envs. Para la otra: pio run -e cultivo-8 -t upload
[platformio]
default_envs = cultivo-4

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/embed_web.py
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

[env:cultivo-4]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DRELAYS_PER_TENT=4

[env:cultivo-8]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DRELAYS_PER_TENT=8
